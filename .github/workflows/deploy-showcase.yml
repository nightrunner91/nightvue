name: Deploy showcase to GitHub Pages

on:
  push:
    # Remove "showcase" once the demo branch is merged into master
    branches: [master, showcase]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # This repository only allows actions owned by nightrunner91,
      # so the workflow uses plain shell instead of the official actions.
      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node 14
        run: |
          source "$NVM_DIR/nvm.sh"
          nvm install 14
          nvm use 14
          node --version
          npm --version

      - name: Install dependencies and build
        run: |
          source "$NVM_DIR/nvm.sh"
          nvm use 14
          npm ci
          npm run build

      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init --quiet
          git checkout --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Best effort: a repository admin can also enable Pages in Settings.
      - name: Enable GitHub Pages
        continue-on-error: true
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          if [ "$STATUS" = "404" ]; then
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              --data '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          else
            echo "Pages is already configured (HTTP ${STATUS})"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
